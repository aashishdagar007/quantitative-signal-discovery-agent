version: "3.9"

# ==============================================================
#  AI Trading System — Docker Compose
#  Production-grade local-first orchestration.
#  Services: postgres, redis, backend (FastAPI), celery-worker,
#            blockchain-audit
# ==============================================================

networks:
  trading-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  blockchain_data:
  model_data:

services:
  # -----------------------------------------------------------
  # PostgreSQL — Dynamic state storage
  # -----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_pass_change_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user} -d ${POSTGRES_DB:-trading_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------
  # Redis — Celery broker + result backend
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # FastAPI Backend
  # -----------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-trading_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-trading_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/models
      - blockchain_data:/app/data
      - ../logs:/app/logs
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -----------------------------------------------------------
  # Celery Worker — Background AI tasks
  # -----------------------------------------------------------
  celery-worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    restart: unless-stopped
    command: ["celery", "-A", "backend.celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "ai_desk,kronos,portfolio,default"]
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${POSTGRES_USER:-trading_user}:${POSTGRES_PASSWORD:-trading_pass_change_in_prod}@postgres:5432/${POSTGRES_DB:-trading_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - model_data:/app/models
      - blockchain_data:/app/data
      - ../logs:/app/logs
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------------------
  # Blockchain Audit Service
  # Runs as a Python microservice persisting the Merkle ledger
  # -----------------------------------------------------------
  blockchain-audit:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "blockchain_audit.api:app", "--host", "0.0.0.0", "--port", "5000", "--workers", "1"]
    env_file:
      - .env
    environment:
      - BLOCKCHAIN_DB_PATH=/app/data/blockchain_audit.db
    ports:
      - "5000:5000"
    volumes:
      - blockchain_data:/app/data
      - ../logs:/app/logs
    networks:
      - trading-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------
  # Celery Flower — Task monitoring UI (optional)
  # -----------------------------------------------------------
  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    networks:
      - trading-net
    depends_on:
      - redis
    profiles:
      - monitoring